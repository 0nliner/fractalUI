site_name: fractalUI
site_description: Layered, headless React UI-kit + config-driven runtime. Build web interfaces fast without giving up control.
site_url: https://0nliner.github.io/fractalUI
repo_url: https://github.com/0nliner/fractalUI
repo_name: 0nliner/fractalUI
edit_uri: edit/master/docs/

theme:
  name: material
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - en
        - ru
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            Guide: Руководство
            Installation: Установка
            Quickstart: Быстрый старт
            Architecture: Архитектура
            Theming: Темизация
            Patterns & App shell: Паттерны и app-shell
            Packages: Пакеты

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Guide:
      - Installation: guide/installation.md
      - Quickstart: guide/quickstart.md
      - Architecture: guide/architecture.md
      - Theming: guide/theming.md
      - Patterns & App shell: guide/patterns.md
  - Packages:
      - "@fractalui/tokens": packages/tokens.md
      - "@fractalui/icons": packages/icons.md
      - "@fractalui/primitives": packages/primitives.md
      - "@fractalui/patterns": packages/patterns.md
      - "@fractalui/runtime": packages/runtime.md
      - "@fractalui/data": packages/data.md

copyright: >
