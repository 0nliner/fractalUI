  &nbsp;·&nbsp;
  <a href="mailto:aleksandrchudaikindev@gmail.com">aleksandrchudaikindev@gmail.com</a>

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/0nliner/fractalUI
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/org/fractalui
