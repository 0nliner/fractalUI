<svg width="912" height="300" viewBox="0 0 912 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="fractalUI — инструмент для создания фронтенда из конфигов">
  <defs>
    <radialGradient id="glow" cx="30%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6fbf7f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6fbf7f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20241f"/>
      <stop offset="100%" stop-color="#191b1e"/>
    </linearGradient>
  </defs>

  <rect width="912" height="300" rx="24" fill="#141518"/>
  <rect x="36" y="34" width="840" height="232" rx="20" fill="url(#card)" stroke="#2b3230"/>
  <rect x="36" y="34" width="420" height="232" rx="20" fill="url(#glow)"/>

  <!-- icon tile -->
  <rect x="70" y="70" width="160" height="160" rx="22" fill="#171a17" stroke="#5aa469" stroke-width="2"/>
  <g transform="translate(102 104)" stroke="#6fbf7f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="0" y="0" width="96" height="70" rx="8"/>
    <line x1="0" y1="20" x2="96" y2="20"/>
    <circle cx="12" cy="10" r="2.4" fill="#6fbf7f" stroke="none"/>
    <circle cx="22" cy="10" r="2.4" fill="#6fbf7f" stroke="none"/>
    <circle cx="32" cy="10" r="2.4" fill="#6fbf7f" stroke="none"/>
    <rect x="14" y="34" width="46" height="24" rx="3" opacity="0.85"/>
    <line x1="40" y1="70" x2="40" y2="86"/>
    <line x1="22" y1="86" x2="58" y2="86"/>
  </g>

  <!-- wordmark -->
  <text x="278" y="140" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="72" font-weight="bold" font-style="italic" fill="#eceadf" letter-spacing="-1">fractalUI</text>

  <!-- tagline -->
  <text x="280" y="188" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="26" fill="#9aa0a6">инструмент для создания</text>
  <text x="280" y="222" font-family="Verdana, 'DejaVu Sans', sans-serif" font-size="26" fill="#9aa0a6">фронтенда из конфигов</text>
